<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <style>
      body { font-family: "Microsoft JhengHei", "Segoe UI", sans-serif; padding: 20px; width: 320px; background: #f4f6f8; color: #333; margin: 0; }
      .container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
      h3 { margin: 0 0 15px; text-align: center; color: #444; font-size: 18px; }
      label { display: block; margin-top: 12px; font-weight: 600; font-size: 13px; color: #555; }
      input { display: block; width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
      input:focus { border-color: #007bff; outline: none; }
      .btn-group { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .btn-full { grid-column: span 2; }
      .options-group { margin-top: 10px; display: flex; gap: 15px; align-items: center; }
      .checkbox-label { display: flex; align-items: center; margin-top: 0; font-weight: normal; cursor: pointer; }
      .checkbox-label input { width: auto; margin: 0 5px 0 0; }
      button { padding: 10px; cursor: pointer; border: 0; border-radius: 6px; font-size: 14px; font-weight: 600; color: #fff; }
      button:active { transform: scale(.98); }
      #save { background: #28a745; } #pause { background: #dc3545; }
      #top { background: #007bff; } #bottom { background: #6610f2; }
      #saveSettings { background: #17a2b8; } #clear { background: #6c757d; }
      #status { margin-top: 15px; padding: 10px; text-align: center; font-weight: bold; border-radius: 6px; font-size: 14px; display: none; }
      .status-running { background: #d4edda; color: #155724; display: block !important; }
      .status-paused { background: #f8d7da; color: #721c24; display: block !important; }
      .status-cleared { background: #e2e3e5; color: #383d41; display: block !important; }
      .status-error { background: #fff3cd; color: #856404; display: block !important; }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>KKTIX &#33258;&#21205;&#36984;&#31080;</h3>
      <label for="keywords">&#38364;&#37749;&#23383;&#65288;&#36887;&#34399;&#20998;&#38548;&#65289;</label>
      <input type="text" id="keywords" placeholder="&#20363;&#22914;&#65306;&#25622;&#28414;&#21312;, 3800">
      <label for="milesecond">&#37325;&#26032;&#25972;&#29702;&#38291;&#38548;&#65288;&#27627;&#31186;&#65289;</label>
      <input type="number" id="milesecond" min="100" value="3000">
      <label for="memberCode">&#26371;&#21729;&#20195;&#30908;&#65295;&#39511;&#35657;&#31572;&#26696;</label>
      <input type="text" id="memberCode" placeholder="&#36984;&#22635;">
      <label for="creditCardNumber">&#20449;&#29992;&#21345;&#35672;&#21029;&#30908;</label>
      <input type="text" id="creditCardNumber" class="member-code" placeholder="&#36984;&#22635;" inputmode="numeric" autocomplete="off">
      <label for="quantity">&#24373;&#25976;</label>
      <input type="number" id="quantity" min="1" max="4" value="1">
      <div class="options-group">
        <label class="checkbox-label"><input type="checkbox" id="random">&#38568;&#27231;&#36984;&#25799;</label>
        <label class="checkbox-label"><input type="checkbox" id="excludeDisability" checked>&#25490;&#38500;&#36523;&#38556;&#24109;</label>
      </div>
      <div class="btn-group">
        <button id="save" class="btn-full">&#22519;&#34892;</button>
        <button id="pause">&#26283;&#20572;</button>
        <button id="top">&#30001;&#19978;&#24448;&#19979;&#22519;&#34892;</button>
        <button id="bottom">&#30001;&#19979;&#24448;&#19978;&#22519;&#34892;</button>
        <button id="saveSettings">&#20786;&#23384;&#35373;&#23450;</button>
        <button id="clear">&#28165;&#38500;&#35373;&#23450;</button>
      </div>
      <div id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
